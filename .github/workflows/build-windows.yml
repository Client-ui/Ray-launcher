
name: Build Ray Client (Windows Installer)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: pyinstaller --noconfirm --onefile --windowed --name "Ray Client" ray_client.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          iscc installer\ray-client.iss

      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: Ray-Client-Windows-Downloads
          path: |
            dist/Ray Client.exe
            installer/Output/Ray-Client-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ray Client.exe
            installer/Output/Ray-Client-Setup.exe
